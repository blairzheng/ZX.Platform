name: 生成后端发布包

on:
  workflow_dispatch:
    inputs:
      from_migration:
        description: DBA 查询到的正式库最后一条完整 MigrationId
        required: true
        type: string
      frontend_ref:
        description: 前端源码分支、标签或提交（默认 team；可填写对应前端发布包的提交）
        required: false
        default: team
        type: string

permissions:
  contents: read

jobs:
  package:
    name: 镜像与数据库升级包
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      FROM_MIGRATION: ${{ inputs.from_migration }}
      TARGET_SCHEMA: ${{ vars.MOM_IDENTITY_DB_SCHEMA || 'ZX_IDENTITY' }}
      MOM_ASSISTANT_FRONTEND_DIR: ${{ github.workspace }}/frontend
    steps:
      - name: 确认发布分支
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/team ]]; then
            echo '请从 team 分支生成发布包。' >&2
            exit 1
          fi

      - uses: actions/checkout@v7.0.1
        with:
          path: backend
          persist-credentials: false

      - name: 获取 AI 资料使用的前端源码
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ vars.MOM_FRONTEND_REPOSITORY || 'blairzheng/ZX.front.vue' }}
          ref: ${{ inputs.frontend_ref || 'team' }}
          path: frontend
          token: ${{ secrets.MOM_FRONTEND_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: 生成本次版本号
        id: version
        shell: bash
        run: |
          release="$(date -u +%Y%m%d)-gh${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'

      - uses: docker/setup-buildx-action@v4.4.1

      - name: 还原固定版本的 EF 工具
        run: dotnet tool restore

      - name: 编译迁移与模型
        run: dotnet build Services/Identity/ZX.Platform.Identity.Api --configuration Release

      - name: 检查 SQL、AI 资料与发布包边界
        run: |
          python3 -m unittest discover -s deploy/docker/tests -p 'test_*sql_export.py'
          python3 -m unittest discover -s deploy/docker/tests -p 'test_release_package.py'
          python3 -m unittest discover -s deploy/docker/tests -p 'test_assistant_sources.py'

      - name: 打包镜像和数据库升级 SQL
        env:
          RELEASE: ${{ steps.version.outputs.release }}
        run: |
          python3 scripts/package-release.py \
            --release "$RELEASE" \
            --from-migration "$FROM_MIGRATION" \
            --schema "$TARGET_SCHEMA"

      - name: 上传本次发布包
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mom-release-${{ steps.version.outputs.release }}
          path: backend/output/mom-release/${{ steps.version.outputs.release }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
